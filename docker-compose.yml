# One command to run the whole kit:
#
#     cp .env.example .env      # then put your Gemini API key in it
#     docker compose up --build
#
# Then open http://localhost:5173, upload a PDF, and ask questions.
#
#   frontend  http://localhost:5173   nginx serving the React build
#   backend   http://localhost:5038   ASP.NET Core API (React talks to this)
#   rag       http://localhost:8000   Python FastAPI RAG service
#   qdrant    http://localhost:6333   vector database (server mode, so uploads index directly)
#
# In compose, Qdrant runs as a SERVER (not embedded on disk), so uploading a PDF
# in the UI indexes it straight away - no separate `python ingest.py` step.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  rag:
    build: ./rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose wiring - overrides whatever is in .env for the containerised run.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-google}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""            # empty => server mode (use QDRANT_URL above)
      COLLECTION_NAME: ${COLLECTION_NAME:-pdf_rag}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
    depends_on:
      - qdrant

  backend:
    build: ./backend
    ports:
      - "5038:8080"
    environment:
      Rag__BaseUrl: http://rag:8000
      Rag__TimeoutSeconds: "600"
      Cors__Origins__0: http://localhost:5173
    depends_on:
      - rag

  frontend:
    build:
      context: ./frontend
      args:
        # The URL the browser uses to reach the backend (host-published port).
        VITE_API_URL: http://localhost:5038
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  qdrant_storage:
